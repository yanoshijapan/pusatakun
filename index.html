<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pusat Akun Yanoshi</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F5F9;
    --surface-3:#E9ECF2;
    --border:#E2E6ED;
    --text:#12161C;
    --text-dim:#5B6472;
    --text-faint:#7D8797;
    --accent:#F2B84B;
    --accent-ink:#231705;
    --danger:#D6373D;
    --ok:#1E9D6E;

    --google:#2F6FE4;
    --google-bg:#EAF1FE;
    --google-bg-soft:#F5F9FF;

    --sosmed:#D6368F;
    --sosmed-bg:#FDEAF4;
    --sosmed-bg-soft:#FFF3F9;

    --lainlain:#0E9A78;
    --lainlain-bg:#E4F7F1;
    --lainlain-bg-soft:#EFFBF7;

    --radius-sm:10px;
    --radius-md:14px;
    --radius-lg:20px;
    --shadow-1: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
    --shadow-2: 0 20px 50px rgba(16,24,40,.16);
    --header-h: 60px;
    --addbar-h: 52px;
    --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    max-width:100vw;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%;}
  h1,h2,h3,p{margin:0;}
  h1,h2,h3{letter-spacing:-.015em;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ---------- Loading overlay ---------- */
  .loading-overlay{
    position:fixed; inset:0; z-index:999;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .5s ease, visibility .5s ease;
  }
  .loading-overlay.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .loading-box{width:min(320px, 80vw); text-align:center;}
  .loading-mark{
    width:52px;height:52px;margin:0 auto 18px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--google),var(--sosmed) 50%,var(--lainlain));
    display:flex;align-items:center;justify-content:center;
    font-size:22px; color:#0D1117; font-weight:800;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .loading-mark.spinner{
    background:none;
    border-radius:50%;
    border:4px solid var(--surface-3);
    border-top-color:var(--google);
    border-right-color:var(--sosmed);
    animation:spin .85s linear infinite;
  }
  @keyframes spin{ to { transform:rotate(360deg); } }
  .loading-box p{color:var(--text-dim); font-size:13.5px; margin-bottom:16px;}
  .progress-track{
    width:100%; height:6px; border-radius:99px; background:var(--surface-2);
    overflow:hidden; border:1px solid var(--border);
  }
  .progress-fill{
    height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--google),var(--lainlain));
    transition:width .25s ease;
  }
  #progressLabel{margin-top:10px; font-family:var(--font-mono); font-size:13px; color:var(--text);}

  /* ---------- Lock overlay ---------- */
  .lock-overlay{ z-index:1000; }
  .lock-overlay .loading-mark{
    background:linear-gradient(135deg, var(--accent), var(--sosmed));
    font-size:20px;
  }
  .lock-overlay .lock-wordmark{
    width:auto; height:auto; min-width:0;
    padding:14px 26px; border-radius:14px;
    font-size:15.5px; font-weight:800; letter-spacing:.01em;
    white-space:nowrap; color:#fff;
  }
  .lock-overlay .pw-form{margin-top:4px; text-align:left;}
  .lock-overlay .pw-form input{text-align:center; letter-spacing:2px;}
  .lock-hint{color:var(--text-faint); font-size:11.5px; margin-top:14px;}

  /* ---------- Sticky header ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top,0px);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; min-height:var(--header-h); height:auto;
    display:flex; align-items:center; gap:10px; padding:8px 14px;
  }
  .brand{display:flex; align-items:center; gap:8px; min-width:0; flex-shrink:1;}
  .brand-logo{
    width:34px; height:34px; border-radius:9px; object-fit:contain; flex-shrink:0;
  }
  .brand-text{min-width:0;}
  .brand-text h1{
    font-size:16px; font-weight:800; letter-spacing:-.015em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-text p.brand-sub{
    font-size:11.5px; color:var(--text-faint); margin-top:1px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .topbar-actions{margin-left:auto; display:flex; align-items:center; gap:8px; min-width:0; flex-shrink:0;}
  .user-count-badge{font-size:11px; color:var(--text-faint); white-space:nowrap;}
  @media (max-width:560px){ .user-count-badge{display:none;} }
  .search-box{position:relative; flex:0 1 150px; min-width:64px;}
  .search-box input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:99px; padding:8px 12px 8px 30px;
    font-size:13px; outline:none; transition:border-color .2s ease;
  }
  .search-box input:focus{border-color:var(--accent);}
  .search-box::before{
    content:'⌕'; position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); font-size:14px; pointer-events:none;
  }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    transition:background .15s ease, transform .1s ease;
  }
  .icon-btn:hover{background:var(--surface-3);}
  .icon-btn:active{transform:scale(.93);}

  /* ---------- Sticky add bar ---------- */
  .addbar{
    position:sticky; top:var(--header-h); z-index:35;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .addbar-inner{max-width:1180px; margin:0 auto; padding:8px 16px;}
  .btn-add{
    width:100%; padding:11px 16px; border-radius:12px; border:1px dashed var(--border);
    background:var(--surface); color:var(--text-dim); font-weight:600; font-size:13.5px;
    cursor:pointer; transition:all .18s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-add:hover{border-color:var(--accent); color:var(--accent); background:var(--surface-2);}
  .btn-add span{font-size:16px; line-height:1;}

  /* ---------- Cards grid ---------- */
  main{max-width:1180px; margin:0 auto; padding:18px 16px 60px;}
  .cards-grid{
    display:grid; grid-template-columns:1fr;
    gap:10px;
  }
  @media (min-width:640px){
    .cards-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .user-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:18px 20px; cursor:pointer; text-align:left;
    box-shadow:var(--shadow-1);
    transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    display:flex; align-items:center; gap:16px;
    animation:cardIn .35s ease both;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .user-card:hover{transform:translateY(-2px); border-color:#C7CEDA; background:var(--surface-2); box-shadow:var(--shadow-2);}
  .user-card:active{transform:translateY(0) scale(.99);}
  .user-card-main{display:flex; flex-direction:column; gap:11px; min-width:0; flex:1;}
  .user-card h3{
    font-size:17px; font-weight:700; line-height:1.3; word-break:break-word;
    color:var(--text); letter-spacing:-.01em;
  }
  .pill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 11px; border-radius:8px; font-size:11.5px; font-weight:700;
    white-space:nowrap;
  }
  .pill .count{opacity:.7; font-weight:600;}
  .pill.google{background:var(--google-bg); color:var(--google);}
  .pill.sosmed{background:var(--sosmed-bg); color:var(--sosmed);}
  .pill.lainlain{background:var(--lainlain-bg); color:var(--lainlain);}
  .pill.empty{background:var(--surface-3); color:var(--text-faint);}
  .card-chevron{
    flex-shrink:0; font-size:20px; color:var(--text-faint);
    transition:transform .15s ease, color .15s ease;
  }
  .user-card:hover .card-chevron{transform:translateX(3px); color:var(--text-dim);}

  .empty-state{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-faint);
  }
  .empty-state p:first-child{font-size:32px; margin-bottom:10px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,8,11,.6); backdrop-filter:blur(2px);
    z-index:200; display:flex; align-items:flex-end; justify-content:center;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @media (min-width:640px){ .modal-backdrop{align-items:center;} }
  .modal-card{
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
    animation:slideUp .28s cubic-bezier(.2,.8,.2,1);
  }
  @media (min-width:640px){
    .modal-card{border-radius:var(--radius-lg); animation:popIn .22s cubic-bezier(.2,.8,.2,1);}
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes popIn{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}

  .modal-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .modal-head h2{font-size:17px; font-weight:700; flex:1; word-break:break-word;}
  .modal-close{
    width:30px;height:30px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .modal-close:hover{color:var(--text);}

  .draft-banner{
    background:var(--surface-3); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:8px; padding:9px 12px; font-size:12.5px; color:var(--text-dim);
    margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }

  /* Group accordions (detail popup) */
  .group-block{
    border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; overflow:hidden;
  }
  .group-block[data-group="google"]{border-left:3px solid var(--google);}
  .group-block[data-group="sosmed"]{border-left:3px solid var(--sosmed);}
  .group-block[data-group="lainlain"]{border-left:3px solid var(--lainlain);}
  .group-head{
    display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;
    background:var(--surface-2);
  }
  .group-head .chip{
    font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px;
  }
  .group-block[data-group="google"] .chip{background:var(--google-bg); color:var(--google);}
  .group-block[data-group="sosmed"] .chip{background:var(--sosmed-bg); color:var(--sosmed);}
  .group-block[data-group="lainlain"] .chip{background:var(--lainlain-bg); color:var(--lainlain);}
  .group-head strong{font-size:13.5px; font-weight:700;}
  .group-head small{color:var(--text-faint); font-size:11.5px;}
  .group-head .caret{margin-left:auto; color:var(--text-faint); transition:transform .2s ease; font-size:12px;}
  .group-block.open .caret{transform:rotate(180deg);}

  .group-body{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    background:var(--surface);
  }
  .group-block.open .group-body{max-height:900px;}
  .group-body-inner{padding:6px 14px 14px;}

  .field-row{
    display:flex; align-items:center; gap:8px; padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .field-row:last-child{border-bottom:none;}
  .field-label{width:118px; flex-shrink:0; font-size:11.5px; color:var(--text); font-weight:700;}
  @media (max-width:480px){
    .field-row{flex-wrap:wrap; row-gap:4px;}
    .field-label{width:100%;}
    .field-value{order:2;}
    .copy-btn{order:3;}
  }

  .subgroup-box{
    border:1px solid var(--border); border-radius:10px; margin-bottom:10px;
    overflow:hidden; background:var(--surface-2);
  }
  .subgroup-box:last-child{margin-bottom:0;}
  .subgroup-title{
    font-size:11.5px; font-weight:700; color:var(--google);
    padding:8px 12px; border-bottom:1px solid var(--border); background:var(--google-bg-soft);
    letter-spacing:.01em;
  }
  .subgroup-body{padding:0 12px;}
  .subgroup-body .field-row:first-child{border-top:none;}
  .subgroup-form-body{padding:12px; display:grid; grid-template-columns:1fr; gap:10px 12px;}
  @media (min-width:640px){
    .subgroup-form-body{grid-template-columns:1fr 1fr;}
  }
  .field-value{
    flex:1; font-family:var(--font-mono); font-size:12.5px; color:var(--text);
    word-break:break-all; min-width:0;
  }
  .field-value.empty{color:var(--text-faint); font-style:italic;}
  .field-input{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border);
    border-radius:7px; padding:7px 9px; color:var(--text); font-family:var(--font-mono);
    font-size:12.5px; outline:none;
  }
  .field-input:focus{border-color:var(--accent);}
  .copy-btn{
    flex-shrink:0; width:26px; height:26px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-faint); cursor:pointer; font-size:12px;
  }
  .copy-btn:hover{color:var(--text);}

  .group-actions{display:flex; gap:8px; padding-top:10px;}
  .btn{
    padding:9px 15px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-weight:600; font-size:12.5px;
    cursor:pointer; transition:filter .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost:hover{background:var(--surface-3);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  /* Password prompt */
  .pw-form{display:flex; flex-direction:column; gap:10px;}
  .pw-form input{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:11px 12px; color:var(--text); font-size:14px; outline:none; letter-spacing:1px;
  }
  .pw-form input:focus{border-color:var(--accent);}
  .pw-error{color:var(--danger); font-size:12px; min-height:16px;}

  /* Add user / general form */
  .form-grid{display:grid; grid-template-columns:1fr; gap:10px 12px;}
  @media (min-width:640px){
    .form-grid{grid-template-columns:1fr 1fr;}
    .form-grid > .form-section-title,
    .form-grid > .subgroup-box,
    .form-grid > .group-actions,
    .form-grid > .form-field-wide{
      grid-column:1 / -1;
    }
  }
  .form-field label{display:block; font-size:11.5px; color:var(--text); font-weight:700; margin-bottom:5px;}
  .form-field input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; color:var(--text); font-family:var(--font-mono); font-size:13px; outline:none;
  }
  .form-field input:focus{border-color:var(--accent);}
  .form-section-title{
    font-size:11.5px; font-weight:700; text-transform:none; margin:14px 0 2px; color:var(--text-dim);
    padding-bottom:6px; border-bottom:1px solid var(--border);
  }

  /* Hamburger dropdown menu */
  .menu-pop{
    position:fixed; z-index:210; top:calc(var(--header-h) + 8px); right:16px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow-2); min-width:200px; overflow:hidden;
    animation:popIn .18s ease;
  }
  .menu-item{
    display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;
    font-size:13px; color:var(--text); border-bottom:1px solid var(--border);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:hover{background:var(--surface-2);}

  /* Toasts */
  .toast-root{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:400;
    display:flex; flex-direction:column; gap:8px; width:min(360px, 90vw);
  }
  .toast{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:10px; font-size:13px; box-shadow:var(--shadow-2);
    animation:toastIn .2s ease;
  }
  .toast.ok{border-left:3px solid var(--ok);}
  .toast.err{border-left:3px solid var(--danger);}
  @keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  select.field-input{appearance:none;}
</style>
</head>
<body>

  <div id="lockOverlay" class="loading-overlay lock-overlay">
    <div class="loading-box">
      <div class="loading-mark lock-wordmark">Yanoshi Asset</div>
      <p>Halaman ini terkunci. Masukkan kode akses untuk melanjutkan.</p>
      <form id="lockForm" class="pw-form">
        <input type="password" id="lockInput" placeholder="Kode akses" autocomplete="off" />
        <p class="pw-error" id="lockError"></p>
        <button type="submit" class="btn btn-primary btn-block">Buka Dashboard</button>
      </form>
      
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
      <div class="loading-mark spinner"></div>
      <p>Memuat data aset tim…</p>
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <p id="progressLabel">0%</p>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="https://yanoshijapan.github.io/asetonline/logohitam.png" alt="Yanoshi Asset" />
        <div class="brand-text">
          <h1>Yanoshi Asset</h1>
          <p class="brand-sub">Data Aset Digital Tim</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="user-count-badge" id="userCount">Memuat…</span>
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="Cari nama" />
        </div>
        <button class="icon-btn" id="hamburgerBtn" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="addbar">
    <div class="addbar-inner">
      <button class="btn-add" id="addUserBtn"><span>+</span> Tambah User Baru</button>
    </div>
  </div>

  <main>
    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

<script>
(function(){
  'use strict';

  /* ============ CONFIG ============ */
  const CONFIG = {
    // TODO: ganti dengan URL Web App hasil deploy Google Apps Script Anda
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwjP_1Zv45alm8sj6yf2g9YU5RHuLTbZYyZv8O2WYueDL3tW8sP7oXwHVe-qXIWSQTH/exec',
    // Kode akses untuk membuka seluruh halaman dashboard
    PAGE_ACCESS_CODE: 'Yanoshi2026'
  };

  const GROUPS = {
    google: {
      label: 'Google', color: 'google',
      fields: [
        { key:'akun1', label:'Akun 1', col:3 },
        { key:'recovery1', label:'Recovery Akun 1', col:4 },
        { key:'akun2', label:'Akun 2', col:6 },
        { key:'recovery2', label:'Recovery Akun 2', col:7 },
        { key:'akun3', label:'Akun 3', col:9 },
        { key:'recovery3', label:'Recovery Akun 3', col:10 }
      ],
      subgroups: [
        { title:'Akun 1', keys:['akun1','recovery1'] },
        { title:'Akun 2', keys:['akun2','recovery2'] },
        { title:'Akun 3', keys:['akun3','recovery3'] }
      ]
    },
    sosmed: {
      label: 'Sosmed', color: 'sosmed',
      fields: [
        { key:'ig', label:'Instagram', col:11 },
        { key:'fb', label:'Facebook', col:12 },
        { key:'tiktok', label:'TikTok', col:13 }
      ]
    },
    lainlain: {
      label: 'Lain-lain', color: 'lainlain',
      fields: [
        { key:'shopee', label:'Shopee', col:15 },
        { key:'icloud', label:'iCloud / App Store', col:16 },
        { key:'serial', label:'Serial Laptop', col:17 },
        { key:'lappass', label:'Password Laptop', col:18 },
        { key:'microsoft', label:'Akun Microsoft', col:19 }
      ]
    }
  };

  const state = { users: [], filtered: [] };

  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));
  const el = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    if (attrs) Object.entries(attrs).forEach(([k,v]) => {
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    });
    children.flat().forEach(c => { if (c!=null) node.append(c.nodeType ? c : document.createTextNode(c)); });
    return node;
  };
  const escapeHtml = (s) => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function toast(msg, type){
    const t = el('div', { class:'toast ' + (type||'ok') }, msg);
    $('#toastRoot').append(t);
    setTimeout(()=> t.remove(), 3200);
  }

  function debounce(fn, wait){
    let timer;
    return (...args) => { clearTimeout(timer); timer = setTimeout(()=>fn(...args), wait); };
  }

  /* ============ Autosave (draft) helpers ============ */
  function saveDraft(key, data){
    try { localStorage.setItem('draft_'+key, JSON.stringify({ data, ts: Date.now() })); }
    catch(e){}
  }
  function loadDraft(key){
    try {
      const raw = localStorage.getItem('draft_'+key);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function clearDraft(key){
    try { localStorage.removeItem('draft_'+key); } catch(e){}
  }
  // Menyimpan referensi form yang sedang aktif diisi, supaya draft-nya bisa
  // langsung "di-flush" (disimpan seketika) sebelum sesi dikunci otomatis,
  // sehingga data yang belum disubmit tidak pernah hilang.
  const activeAutosaveForms = [];
  function attachAutosave(formEl, key){
    const saveNow = () => {
      const data = {};
      $$('[data-field]', formEl).forEach(i => data[i.dataset.field] = i.value);
      saveDraft(key, data);
    };
    const handler = debounce(saveNow, 450);
    formEl.addEventListener('input', handler);
    activeAutosaveForms.push({ formEl, saveNow });
  }
  function flushAllAutosaves(){
    activeAutosaveForms
      .filter(x => document.body.contains(x.formEl))
      .forEach(x => x.saveNow());
  }
  function restoreDraftInto(formEl, key){
    const draft = loadDraft(key);
    if (!draft) return false;
    $$('[data-field]', formEl).forEach(i => {
      if (draft.data[i.dataset.field] !== undefined) i.value = draft.data[i.dataset.field];
    });
    return true;
  }

  /* ============ API ============ */
  async function apiGet(params){
    const url = new URL(CONFIG.APPS_SCRIPT_URL);
    Object.entries(params||{}).forEach(([k,v]) => url.searchParams.set(k,v));
    const res = await fetch(url.toString());
    return res.json();
  }
  async function apiPost(payload){
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  /* ============ Loading progress ============ */
  function runProgress(){
    const bar = $('#progressBar'), label = $('#progressLabel');
    let pct = 0;
    const timer = setInterval(() => {
      pct += Math.random()*10;
      if (pct > 88) pct = 88;
      bar.style.width = pct + '%';
      label.textContent = Math.round(pct) + '%';
    }, 140);
    return {
      finish(){
        clearInterval(timer);
        bar.style.width = '100%';
        label.textContent = '100%';
        setTimeout(()=> $('#loadingOverlay').classList.add('hidden'), 400);
      },
      fail(){
        clearInterval(timer);
        label.textContent = 'Gagal memuat';
      }
    };
  }

  /* ============ Load & render ============ */
  async function loadUsers(){
    if (CONFIG.APPS_SCRIPT_URL.indexOf('PASTE_URL_WEB_APP_ANDA') === 0) {
      $('#loadingOverlay').classList.add('hidden');
      toast('APPS_SCRIPT_URL belum diisi di index.html', 'err');
      $('#userCount').textContent = 'Belum terhubung ke Apps Script';
      return;
    }
    const progress = runProgress();
    try {
      const resp = await apiGet({ action:'list' });
      if (!resp.ok) throw new Error(resp.error || 'Gagal memuat data');
      state.users = resp.users;
      state.filtered = resp.users;
      renderCards();
      progress.finish();
    } catch (err) {
      progress.fail();
      toast('Gagal memuat data: ' + err.message, 'err');
    }
  }

  function groupFilledCount(user, groupKey){
    return GROUPS[groupKey].fields.filter(f => user[groupKey] && user[groupKey][f.key]).length;
  }

  function renderCards(){
    const grid = $('#cardsGrid');
    grid.innerHTML = '';
    $('#userCount').textContent = state.filtered.length + ' user terdaftar';
    if (!state.filtered.length){
      grid.append(el('div', { class:'empty-state' },
        el('p', null, '🗂'),
        el('p', null, 'Belum ada user. Tambahkan user baru di atas.')));
      return;
    }
    state.filtered.forEach(user => {
      const pills = Object.entries(GROUPS).map(([groupKey, group]) => {
        const filled = groupFilledCount(user, groupKey);
        const total = group.fields.length;
        return el('span', { class:'pill ' + (filled > 0 ? groupKey : 'empty') },
          group.label, el('span', { class:'count' }, filled + '/' + total));
      });
      const card = el('button', { class:'user-card', onclick: () => openUserModal(user) },
        el('div', { class:'user-card-main' },
          el('h3', null, user.name),
          el('div', { class:'pill-row' }, pills)
        ),
        el('span', { class:'card-chevron' }, '›')
      );
      grid.append(card);
    });
  }

  $('#searchInput').addEventListener('input', debounce((e) => {
    const q = e.target.value.trim().toLowerCase();
    state.filtered = state.users.filter(u => u.name.toLowerCase().includes(q));
    renderCards();
  }, 150));

  /* ============ Modal engine ============ */
  function openModal(contentNode, opts){
    closeModal();
    const backdrop = el('div', { class:'modal-backdrop', onclick: (e) => { if (e.target === backdrop && !(opts&&opts.persist)) closeModal(); } },
      el('div', { class:'modal-card' }, contentNode)
    );
    $('#modalRoot').append(backdrop);
    return backdrop;
  }
  function closeModal(){ $('#modalRoot').innerHTML = ''; }

  /* ============ User detail modal (3 group accordions) ============ */
  function openUserModal(user){
    const head = el('div', { class:'modal-head' },
      el('h2', null, user.name),
      el('button', { class:'modal-close', onclick: closeModal }, '✕')
    );
    const body = el('div', null);
    Object.entries(GROUPS).forEach(([groupKey, group]) => {
      const filled = groupFilledCount(user, groupKey);
      const block = el('div', { class:'group-block', 'data-group':groupKey });
      const bodyInner = el('div', { class:'group-body-inner' });

      const renderFieldRow = (f) => {
        const val = user[groupKey][f.key];
        return el('div', { class:'field-row' },
          el('div', { class:'field-label' }, f.label),
          el('div', { class:'field-value' + (val ? '' : ' empty') }, val || 'kosong'),
          el('button', { class:'copy-btn', title:'Salin', onclick:(e)=>{ e.stopPropagation(); copyText(val); } }, '⧉')
        );
      };

      if (group.subgroups){
        group.subgroups.forEach(sub => {
          const box = el('div', { class:'subgroup-box' },
            el('div', { class:'subgroup-title' }, sub.title),
            el('div', { class:'subgroup-body' }, sub.keys.map(k => renderFieldRow(group.fields.find(f => f.key === k))))
          );
          bodyInner.append(box);
        });
      } else {
        group.fields.forEach(f => bodyInner.append(renderFieldRow(f)));
      }
      bodyInner.append(el('div', { class:'group-actions' },
        el('button', { class:'btn btn-primary btn-block', onclick: (e) => { e.stopPropagation(); requestEdit(user, groupKey); } }, '🔒 Edit ' + group.label)
      ));

      const groupHead = el('div', { class:'group-head', onclick: () => block.classList.toggle('open') },
        el('span', { class:'chip' }, group.label),
        el('strong', null, group.label),
        el('small', null, filled + '/' + group.fields.length + ' terisi'),
        el('span', { class:'caret' }, '▾')
      );
      block.append(groupHead, el('div', { class:'group-body' }, bodyInner));
      body.append(block);
    });

    openModal(el('div', null, head, body));
  }

  async function copyText(val){
    if (!val) { toast('Tidak ada data untuk disalin', 'err'); return; }
    try { await navigator.clipboard.writeText(String(val)); toast('Disalin ke clipboard'); }
    catch(e){ toast('Gagal menyalin', 'err'); }
  }

  /* ============ Password prompt ============ */
  function requestEdit(user, groupKey){
    const errBox = el('p', { class:'pw-error' });
    const input = el('input', { type:'password', placeholder:'Masukkan kode edit', autocomplete:'off' });
    const form = el('form', { class:'pw-form', onsubmit: async (e) => {
      e.preventDefault();
      const pass = input.value.trim();
      if (!pass) return;
      const btn = $('button[type=submit]', form);
      btn.disabled = true; btn.textContent = 'Memeriksa…';
      try {
        const resp = await apiPost({ action:'verifyPassword', row:user.row, password:pass });
        if (resp.ok && resp.valid){
          closeModal();
          openEditForm(user, groupKey, pass);
        } else {
          errBox.textContent = 'Kode edit salah, coba lagi.';
          btn.disabled = false; btn.textContent = 'Buka Kunci';
        }
      } catch(err){
        errBox.textContent = 'Gagal menghubungi server.';
        btn.disabled = false; btn.textContent = 'Buka Kunci';
      }
    }},
      input,
      errBox,
      el('div', { class:'group-actions' },
        el('button', { type:'button', class:'btn btn-ghost', onclick: () => openUserModal(user) }, 'Batal'),
        el('button', { type:'submit', class:'btn btn-primary', style:'flex:1' }, 'Buka Kunci')
      )
    );

    const head = el('div', { class:'modal-head' },
      el('h2', null, 'Kode Edit — ' + GROUPS[groupKey].label),
      el('button', { class:'modal-close', onclick: closeModal }, '✕')
    );
    openModal(el('div', null, head, el('p', { style:'color:var(--text-dim); font-size:12.5px; margin-bottom:14px;' }, 'Masukkan kode edit milik ' + user.name + ' untuk mengubah data grup ini.'), form));
    setTimeout(()=> input.focus(), 150);
  }

  /* ============ Edit form (per group, with autosave) ============ */
  function openEditForm(user, groupKey, password){
    const group = GROUPS[groupKey];
    const draftKey = 'edit_' + user.row + '_' + groupKey;

    const head = el('div', { class:'modal-head' },
      el('h2', null, 'Edit ' + group.label + ' — ' + user.name),
      el('button', { class:'modal-close', onclick: closeModal }, '✕')
    );

    const form = el('form', { class:'form-grid' });
    const renderFieldInput = (f) => {
      const current = user[groupKey][f.key] || '';
      return el('div', { class:'form-field' },
        el('label', null, f.label),
        el('input', { type:'text', 'data-field':f.key, 'data-col':f.col, value:current, autocomplete:'off' })
      );
    };
    if (group.subgroups){
      group.subgroups.forEach(sub => {
        form.append(el('div', { class:'subgroup-box' },
          el('div', { class:'subgroup-title' }, sub.title),
          el('div', { class:'subgroup-form-body' }, sub.keys.map(k => renderFieldInput(group.fields.find(f => f.key === k))))
        ));
      });
    } else {
      group.fields.forEach(f => form.append(renderFieldInput(f)));
    }

    const actions = el('div', { class:'group-actions', style:'margin-top:8px;' },
      el('button', { type:'button', class:'btn btn-ghost', onclick: () => { closeModal(); openUserModal(user); } }, 'Batal'),
      el('button', { type:'submit', class:'btn btn-primary', style:'flex:1' }, 'Simpan Perubahan')
    );
    form.append(actions);

    const container = el('div', null, head);
    const hasDraft = restoreDraftInto(form, draftKey);
    if (hasDraft){
      container.append(el('div', { class:'draft-banner' }, '↺ Perubahan yang belum tersimpan sebelumnya sudah dipulihkan.'));
    }
    container.append(form);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('button[type=submit]', form);
      btn.disabled = true; btn.textContent = 'Menyimpan…';
      const fields = {};
      $$('[data-field]', form).forEach(inp => { fields[inp.dataset.col] = inp.value; });
      try {
        const resp = await apiPost({ action:'updateFields', row:user.row, password, fields });
        if (resp.ok){
          clearDraft(draftKey);
          Object.assign(user[groupKey], Object.fromEntries(group.fields.map(f => [f.key, fields[f.col]])));
          toast('Perubahan tersimpan');
          closeModal();
          openUserModal(user);
        } else {
          toast(resp.error || 'Gagal menyimpan', 'err');
          btn.disabled = false; btn.textContent = 'Simpan Perubahan';
        }
      } catch(err){
        toast('Gagal menghubungi server', 'err');
        btn.disabled = false; btn.textContent = 'Simpan Perubahan';
      }
    });

    attachAutosave(form, draftKey);
    openModal(container, { persist:true });
  }

      )
    );

    );
    form.append(actions);

    const container = el('div', null, head);
    if (restoreDraftInto(form, draftKey)){
      container.append(el('div', { class:'draft-banner' }, '↺ Draft user sebelumnya dipulihkan otomatis.'));

    form.addEventListener('submit', async (e) => {

        btn.disabled = false; btn.textContent = 'Simpan User';

      try {

          toast('User baru ditambahkan');

          toast(resp.error || 'Gagal menambahkan user', 'err');
          btn.disabled = false; btn.textContent = 'Simpan User';
        }
      } catch(err){
        toast('Gagal menghubungi server', 'err');
        btn.disabled = false; btn.textContent = 'Simpan User';
      }

    attachAutosave(form, draftKey);
    openModal(container, { persist:true });

  function fieldInputs(pairs){
    return pairs.map(([key,label]) => el('div', { class:'form-field' },
      el('label', null, label),
      el('input', { type:'text', 'data-field':key, autocomplete:'off' })

  $('#addUserBtn').addEventListener('click', openAddUserModal);

  /* ============ Hamburger menu + change password ============ */
  $('#hamburgerBtn').addEventListener('click', (e) => {

    const existing = document.querySelector('.menu-pop');

  function openChangePasswordModal(){
    const head = el('div', { class:'modal-head' },
      el('h2', null, 'Ganti Kode Edit'),
      el('button', { class:'modal-close', onclick: closeModal }, '✕')
    );
    const select = el('select', { class:'field-input', style:'width:100%; margin-bottom:10px;' },

      ...state.users.map(u => el('option', { value:u.row }, u.name))
    );
    const oldPw = el('input', { type:'password', placeholder:'Kode edit lama' });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  /* ============ Lock screen (gerbang akses halaman) ============ */
  // Sesi terkunci otomatis TEPAT 5 menit sejak dashboard dibuka, ada atau
  // tidaknya aktivitas dari user (bukan timer yang direset oleh aktivitas).
  const SESSION_TIMEOUT_MS = 5 * 60 * 1000;
  let sessionCheckInterval = null;

  function stopSessionTimer(){
    if (sessionCheckInterval){ clearInterval(sessionCheckInterval); sessionCheckInterval = null; }
  }

  function startSessionTimer(){
    stopSessionTimer();
    // Dicek berkala (bukan sekali setTimeout) supaya tetap akurat walau tab
    // sempat dijalankan di background dan timer sempat "ditahan" browser.
    sessionCheckInterval = setInterval(checkSessionExpiry, 1000);
  }

  function checkSessionExpiry(){
    if (sessionStorage.getItem('dashboardUnlocked') !== '1'){ stopSessionTimer(); return; }
    const startedAt = parseInt(sessionStorage.getItem('dashboardUnlockedAt') || '0', 10);
    if (!startedAt || (Date.now() - startedAt) >= SESSION_TIMEOUT_MS){
      lockDashboardSessionExpired();
    }
  }

  function lockDashboardSessionExpired(){
    // Pastikan data yang sedang diketik/diedit (belum disubmit) tersimpan
    // sebagai draft dulu sebelum layar dikunci, sehingga tidak hilang,
    // apa pun status aktivitas user saat ini.
    flushAllAutosaves();
    closeModal();
    stopSessionTimer();
    sessionStorage.removeItem('dashboardUnlocked');
    sessionStorage.removeItem('dashboardUnlockedAt');
    $('#lockOverlay').classList.remove('hidden');
    const errBox = $('#lockError');
    if (errBox) errBox.textContent = '';
    const input = $('#lockInput');
    if (input) input.value = '';
    toast('Sesi otomatis terkunci setelah 5 menit. Data yang belum disimpan sudah diamankan sebagai draft.', 'err');
    setTimeout(() => input && input.focus(), 300);
  }

  function unlockDashboard(){
    sessionStorage.setItem('dashboardUnlocked', '1');
    sessionStorage.setItem('dashboardUnlockedAt', String(Date.now()));
    $('#lockOverlay').classList.add('hidden');
    $('#loadingOverlay').classList.remove('hidden');
    loadUsers();
    startSessionTimer();
  }

  $('#lockForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#lockInput');
    const errBox = $('#lockError');
    if (input.value === CONFIG.PAGE_ACCESS_CODE){
      errBox.textContent = '';
      unlockDashboard();
    } else {
      errBox.textContent = 'Kode akses salah, coba lagi.';
      input.value = '';
      input.focus();
    }
  });

  function initApp(){
    if (sessionStorage.getItem('dashboardUnlocked') === '1'){
      // Cek dulu apakah 5 menit sejak dibuka sudah lewat (misal karena reload halaman).
      const startedAt = parseInt(sessionStorage.getItem('dashboardUnlockedAt') || '0', 10);
      if (!startedAt || (Date.now() - startedAt) >= SESSION_TIMEOUT_MS){
        sessionStorage.removeItem('dashboardUnlocked');
        sessionStorage.removeItem('dashboardUnlockedAt');
        $('#loadingOverlay').classList.add('hidden');
        setTimeout(() => $('#lockInput').focus(), 300);
        return;
      }
      $('#lockOverlay').classList.add('hidden');
      loadUsers();
      startSessionTimer();
    } else {
      $('#loadingOverlay').classList.add('hidden');
      setTimeout(() => $('#lockInput').focus(), 300);
    }
  }

  initApp();
})();
</script>
